name: CI

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tributary-client: ${{ steps.filter.outputs.tributary-client }}
      scribe-data: ${{ steps.filter.outputs.scribe-data }}
      scribe-react: ${{ steps.filter.outputs.scribe-react }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tributary-client:
              - 'tributary-client/**'
            scribe-data:
              - 'apps/scribe/scribe-data/**'
            scribe-react:
              - 'apps/scribe/scribe-react/**'

  test-tributary-client:
    needs: changes
    if: needs.changes.outputs.tributary-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tributary-client
      - run: npm test
        working-directory: tributary-client

  test-scribe-data:
    needs: changes
    if: >-
      needs.changes.outputs.scribe-data == 'true' ||
      needs.changes.outputs.tributary-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tributary-client
      - run: npm run build
        working-directory: tributary-client
      - run: npm ci
        working-directory: apps/scribe/scribe-data
      - run: npm test
        working-directory: apps/scribe/scribe-data

  test-scribe-react:
    needs: changes
    if: >-
      needs.changes.outputs.scribe-react == 'true' ||
      needs.changes.outputs.scribe-data == 'true' ||
      needs.changes.outputs.tributary-client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tributary-client
      - run: npm run build
        working-directory: tributary-client
      - run: npm ci
        working-directory: apps/scribe/scribe-data
      - run: npm run build
        working-directory: apps/scribe/scribe-data
      - run: npm ci
        working-directory: apps/scribe/scribe-react
      - run: npm test
        working-directory: apps/scribe/scribe-react
