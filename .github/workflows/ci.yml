name: CI

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      tributary-client: ${{ steps.filter.outputs.tributary-client }}
      tributary-cli: ${{ steps.filter.outputs.tributary-cli }}
      scribe-data: ${{ steps.filter.outputs.scribe-data }}
      scribe-react: ${{ steps.filter.outputs.scribe-react }}
      scribe-cli: ${{ steps.filter.outputs.scribe-cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            tributary-client:
              - 'tributary-client/**'
            tributary-cli:
              - 'tributary-cli/**'
            scribe-data:
              - 'apps/scribe/scribe-data/**'
            scribe-react:
              - 'apps/scribe/scribe-react/**'
            scribe-cli:
              - 'apps/scribe/scribe-cli/**'

  test-tributary-client:
    needs: changes
    if: >-
      needs.changes.outputs.tributary-client == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
        working-directory: tributary-client
      - run: npm test
        working-directory: tributary-client

  test-tributary-cli:
    needs: changes
    if: >-
      needs.changes.outputs.tributary-cli == 'true' ||
      needs.changes.outputs.tributary-client == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        working-directory: tributary-client
      - run: npm run typecheck
        working-directory: tributary-cli

  test-scribe-data:
    needs: changes
    if: >-
      needs.changes.outputs.scribe-data == 'true' ||
      needs.changes.outputs.tributary-client == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        working-directory: tributary-client
      - run: npm run typecheck
        working-directory: apps/scribe/scribe-data
      - run: npm test
        working-directory: apps/scribe/scribe-data

  test-scribe-react:
    needs: changes
    if: >-
      needs.changes.outputs.scribe-react == 'true' ||
      needs.changes.outputs.scribe-data == 'true' ||
      needs.changes.outputs.tributary-client == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        working-directory: tributary-client
      - run: npm run build
        working-directory: apps/scribe/scribe-data
      - run: npm run typecheck
        working-directory: apps/scribe/scribe-react
      - run: npm test
        working-directory: apps/scribe/scribe-react

  test-scribe-cli:
    needs: changes
    if: >-
      needs.changes.outputs.scribe-cli == 'true' ||
      needs.changes.outputs.scribe-data == 'true' ||
      needs.changes.outputs.tributary-client == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        working-directory: tributary-client
      - run: npm run build
        working-directory: apps/scribe/scribe-data
      - run: npm run typecheck
        working-directory: apps/scribe/scribe-cli
      - run: npm test
        working-directory: apps/scribe/scribe-cli
